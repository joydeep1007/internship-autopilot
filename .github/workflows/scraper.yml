name: Internship Autopilot — Daily Scraper

on:
  schedule:
    # 7:30 AM IST = 2:00 AM UTC, Mon–Fri
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    # Also triggerable manually from GitHub Actions tab

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit jobs.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt --break-system-packages -q

      - name: Run scraper pipeline
        env:
          GEMINI_KEY:        ${{ secrets.GEMINI_KEY }}
          SNOV_CLIENT_ID:    ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_SECRET:       ${{ secrets.SNOV_SECRET }}
          HUNTER_KEY:        ${{ secrets.HUNTER_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL:         ${{ secrets.PROXY_URL }}
        run: |
          cd scraper && python main.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "Internship Autopilot Bot"
          git config user.email "bot@internship-autopilot.local"
          git add frontend/src/data/jobs.json scraper/.seen_ids.json
          git diff --staged --quiet || git commit -m "chore: update job listings [$(date +'%Y-%m-%d')]"
          git push
